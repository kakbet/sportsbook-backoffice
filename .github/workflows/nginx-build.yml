# .github/workflows/nginx-build.yml
name: Nginx Build and Push

on:
  workflow_call:
    inputs:
      super_branch:
        description: 'Super repository branch'
        required: false
        default: 'main'
        type: string
      version:
        description: 'Version tag'
        required: true
        type: string
      ecr_registry:
        description: 'ECR Registry URL'
        required: true
        type: string
      ecr_repository:
        description: 'ECR Repository name'
        required: true
        type: string
      dockerfile_path:
        description: 'Dockerfile path'
        required: false
        default: 'sportsbook-nginx/Dockerfile'
        type: string
      build_context:
        description: 'Build context path'
        required: false
        default: '.'
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      nginx_version:
        description: 'Nginx version'
        required: false
        default: '1.17-alpine'
        type: string
      build_args:
        description: 'Build arguments (JSON format)'
        required: false
        type: string
      labels:
        description: 'Labels (JSON format)'
        required: false
        type: string
    outputs:
      image_url:
        description: "Full Docker image URL"
        value: ${{ jobs.nginx-build.outputs.image_url }}
      image_digest:
        description: "Image digest"
        value: ${{ jobs.nginx-build.outputs.image_digest }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      PAT_TOKEN:
        required: true
      # 🔴 A reusable workflow does NOT inherit its caller's secrets. Declaring
      # them here and passing them from EVERY caller are two halves of one
      # mechanism: with either half missing `secrets.HARBOR_ROBOT_*` is the EMPTY
      # STRING inside this file, `docker/login-action` throws, and because that
      # login precedes the build the ECR push is lost along with the Harbor one.
      # This file has TWO callers: php-sportsbook-main.yml and
      # rebuild-existing-tag.yml — both must pass these.
      HARBOR_ROBOT_USER:
        required: true
      HARBOR_ROBOT_TOKEN:
        required: true

jobs:
  nginx-build:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    
    outputs:
      image_url: ${{ steps.build.outputs.image_url }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          path: main

      - name: Checkout Super Repository (www)
        uses: actions/checkout@v4
        with:
          repository: kakbet/Super
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.super_branch }}
          path: www

      - name: Prepare Project Structure for Nginx Build
        run: |
          echo "Setting up project structure for nginx build..."
          
          # Nginx için gerekli dosyaları main repository'den kopyala
          cp -r main/sportsbook-nginx .
          
          # www klasörünü root'a kopyala (Dockerfile bunu bekliyor)
          # COPY www /home/www-data/www satırı için
          
          echo "Project structure ready for nginx build:"
          ls -la
          echo "Nginx files:"
          ls -la sportsbook-nginx/

      - name: Clean Git Directories
        run: |
          echo "Cleaning .git directories..."
          rm -rf www/.git
          echo "Cleanup completed"

      # 🪤 ORDER: isolate BEFORE buildx. buildx keeps builder state under
      # $DOCKER_CONFIG/buildx; isolate later and the builder lands in the
      # SHARED directory while the build looks in the isolated one.
      # WHY: every runner on this host shares HOME, so one ~/.docker/config.json
      # is shared state between concurrent jobs and amazon-ecr-login's post step
      # DELETES the credentials it wrote — measured in a sibling repo as a
      # `401 Unauthorized` on the push of an already-built image.
      - name: Isolate Docker config for this job
        run: |
          cfg="$RUNNER_TEMP/docker-$GITHUB_RUN_ID-$GITHUB_JOB"
          mkdir -p "$cfg"
          echo '{}' > "$cfg/config.json"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ inputs.platforms }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Harbor credentials are a REPO secret, not an organization one. This
      # repository is public, where an org secret WOULD resolve, but its private
      # siblings in this family are on the free plan where it does not — the
      # family keeps ONE spelling so the pattern travels unchanged.
      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: registry.everva.com.tr
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Verify Nginx Configuration
        run: |
          echo "Verifying nginx configuration..."
          
          # Dockerfile kontrol
          if [ ! -f "${{ inputs.dockerfile_path }}" ]; then
            echo "❌ Dockerfile not found at ${{ inputs.dockerfile_path }}!"
            exit 1
          fi
          echo "✅ Found: ${{ inputs.dockerfile_path }}"
          
          # Nginx conf dosyaları kontrol
          if [ -f "sportsbook-nginx/nginx.conf" ]; then
            echo "✅ Found: nginx.conf"
          fi
          
          if [ -f "sportsbook-nginx/conf.d/default.conf" ]; then
            echo "✅ Found: default.conf"
          fi
          
          # www klasörü kontrol
          if [ -d "www" ]; then
            echo "✅ Found: www directory"
            echo "www contents:"
            ls -la www/ | head -10
          else
            echo "❌ www directory not found!"
            exit 1
          fi
          
          echo "✅ Nginx structure verified"

      - name: Prepare Build Arguments
        id: build-args
        run: |
          BUILD_ARGS=""
          if [ -n "${{ inputs.build_args }}" ]; then
            echo '${{ inputs.build_args }}' | jq -r 'to_entries[] | "--build-arg \(.key)=\(.value)"' > build_args.txt
            BUILD_ARGS=$(cat build_args.txt | tr '\n' ' ')
          fi
          
          # Default build args
          BUILD_ARGS="$BUILD_ARGS --build-arg VERSION=${{ inputs.version }}"
          BUILD_ARGS="$BUILD_ARGS --build-arg NGINX_VERSION=${{ inputs.nginx_version }}"
          
          echo "build_args=$BUILD_ARGS" >> $GITHUB_OUTPUT

      - name: Prepare Labels
        id: labels
        run: |
          LABELS=""
          if [ -n "${{ inputs.labels }}" ]; then
            echo '${{ inputs.labels }}' | jq -r 'to_entries[] | "--label \(.key)=\(.value)"' > labels.txt
            LABELS=$(cat labels.txt | tr '\n' ' ')
          fi
          
          # Default labels
          LABELS="$LABELS --label version=${{ inputs.version }}"
          LABELS="$LABELS --label build.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LABELS="$LABELS --label build.revision=${{ github.sha }}"
          LABELS="$LABELS --label description=\"Sportsbook Nginx Reverse Proxy\""
          LABELS="$LABELS --label nginx.version=\"${{ inputs.nginx_version }}\""
          LABELS="$LABELS --label super.branch=\"${{ inputs.super_branch }}\""
          
          echo "labels=$LABELS" >> $GITHUB_OUTPUT

      - name: Prepare Tags
        id: tags
        # 🔴🔴 THIS IS THE HOLE THAT ACTUALLY FIRED. The caller invokes TWO build
        # workflows — php-multi-repo-build.yml and this one — and only the first
        # was fenced. Measured: three branch dispatches (34744094370,
        # 34746482223, 34746648832) each published sb/sportsbook-nginx:<version>
        # AND :latest from branch code, moving the production `latest` off
        # 4.2.121 onto a 4.2.122 that main never released
        # (`git ls-remote --tags origin refs/tags/v4.2.122` => 0). No running
        # workload was affected — the cluster pins :4.2.121 — but the tag moved,
        # which is exactly what this campaign exists to prevent.
        #
        # 🔑 Lesson: fencing "the build workflow" is not enough when a caller
        # has more than one.
        #
        # working-directory: the orchestrator repo is checked out into `main/`
        # (Checkout Main Repository, path: main), so the script is not at the
        # job root.
        env:
          ECR_REGISTRY: ${{ inputs.ecr_registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          VERSION_VALUE: ${{ inputs.version }}
          VERSION_SOURCE: allocated
          TAG_STYLE: docker-args
        working-directory: main
        run: ./scripts/ci/prepare-image-tags.sh >> "$GITHUB_OUTPUT"

      - name: Mirror the published tags onto Harbor
        id: dual
        # 🔑 The tag DECISION stays where it already is. prepare-image-tags.sh is the
        # one door that decides which names a run may publish, it is shared verbatim
        # with the sibling repos, and it is not touched here. This step re-decides
        # nothing: it TWINS whatever that script allowed, so Harbor can never receive
        # a name the fence refused on ECR and the two registries cannot drift apart.
        # 🔑 WHY THE CSV AND NOT `docker_args`: the script emits `tags=` (comma list)
        # UNCONDITIONALLY and `docker_args=` only as a second spelling of the same
        # decision. Mirroring the CSV and re-deriving the `-t` flags here — with the
        # script's own formatting — keeps ONE parser instead of two.
        # 🔑 HARBOR_REPOSITORY is DERIVED from inputs.ecr_repository rather than
        # named a second time. This workflow is called once per image, so a second
        # spelling would be a second chance to get it wrong: the caller publishes
        # sb/sportsbook-backoffice and sb/sportsbook-nginx through the same two
        # files, and a name swapped between them would put one image under the
        # other's name with a digest gate that CANNOT see it — both references
        # would be the same build's manifest. Deriving makes that unreachable.
        # 🪤 Fail-closed on shape. A reference that is not exactly
        # `$ECR_REGISTRY/$ECR_REPOSITORY:<tag>` stops the run instead of being quietly
        # dropped — a dropped entry is a tag on ECR and not on Harbor, i.e. the silent
        # half-migration this step exists to prevent. An EMPTY list stops it too.
        env:
          ECR_REGISTRY: ${{ inputs.ecr_registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          HARBOR_REGISTRY: registry.everva.com.tr
          HARBOR_REPOSITORY: ${{ inputs.ecr_repository }}
          ECR_TAGS: ${{ steps.tags.outputs.tags }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary_tag }}
        run: |
          set -euo pipefail
          ecr_base="$ECR_REGISTRY/$ECR_REPOSITORY"
          harbor_base="$HARBOR_REGISTRY/$HARBOR_REPOSITORY"
          [ "$ECR_REPOSITORY" = "$HARBOR_REPOSITORY" ] || {
            echo "::error::repository path mismatch: ECR_REPOSITORY='$ECR_REPOSITORY' but HARBOR_REPOSITORY='$HARBOR_REPOSITORY' — the two registries must use the same path"
            exit 1
          }
          [ -n "${ECR_TAGS:-}" ]    || { echo "::error::prepare-image-tags produced no tags"; exit 1; }
          [ -n "${PRIMARY_TAG:-}" ] || { echo "::error::prepare-image-tags produced no primary_tag"; exit 1; }
          all=""; n=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              "$ecr_base":?*) : ;;
              *) echo "::error::tag reference is not ${ecr_base}:<tag>: '$ref'"; exit 1 ;;
            esac
            tag="${ref#"$ecr_base":}"
            case "$tag" in
              *:*|*/*) echo "::error::tag component is not a bare tag: '$tag'"; exit 1 ;;
            esac
            all="${all:+$all,}${ref},${harbor_base}:${tag}"
            n=$((n + 1))
          done <<< "$(printf '%s' "$ECR_TAGS" | tr ',' '\n')"
          [ "$n" -gt 0 ] || { echo "::error::no tag survived the mirror step"; exit 1; }
          # Count what was actually built rather than trusting the loop that built it:
          # if the Harbor twin were ever dropped, every check downstream would still
          # pass on the ECR half and the gap would only surface at the digest gate —
          # i.e. AFTER the image had been published to one registry and not the other.
          refs_n="$(printf '%s' "$all" | tr ',' '\n' | grep -c .)"
          [ "$refs_n" -eq "$((n * 2))" ] \
            || { echo "::error::expected $((n * 2)) references for $n tag(s) but built $refs_n — an ECR tag lost its Harbor twin"; exit 1; }
          # `ecr_ref`/`harbor_ref` below are what the verification gates inspect, and
          # they are assembled from PRIMARY_TAG. If that tag is not one this run
          # actually published, those gates would inspect an image this run never
          # pushed: either an older one, which they would wrongly accept, or a missing
          # one, which they would report as a failure whose real cause is here.
          # 🪤 The quotes around the middle of the pattern are a CHECK, not style: an
          # unquoted `$PRIMARY_TAG` is expanded as a glob by `case`, so a primary tag
          # of `*` would match any list and walk straight through this guard.
          case ",$ECR_TAGS," in
            *",$ecr_base:$PRIMARY_TAG,"*) : ;;
            *) echo "::error::primary_tag '$PRIMARY_TAG' is not among the tags this run published"; exit 1 ;;
          esac
          echo "$n published tag(s) -> $refs_n references:"
          printf '%s' "$all" | tr ',' '\n' | sed 's/^/  /'
          # Same formatting the script uses for docker_args, so the two spellings of
          # one decision cannot drift apart in this shell either.
          dargs="$(printf '%s' "$all" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ' | sed 's/ $//')"
          {
            echo "tags=$all"
            echo "docker_args=$dargs"
            echo "count=$n"
            echo "ecr_ref=${ecr_base}:${PRIMARY_TAG}"
            echo "harbor_ref=${harbor_base}:${PRIMARY_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Nginx Docker Image
        id: build
        run: |
          echo "🌐 Building and pushing Sportsbook Nginx Docker image..."
          
          # The PUBLISHED name: off the default branch the fence withholds
          # :<version>, so a URL built from it would name an image this run
          # never pushed.
          # --metadata-file surfaces the pushed manifest digest
          # (containerimage.digest) WITHOUT a second registry round-trip: it is
          # the immutable sha256 of what THIS run pushed. `image_digest` has been
          # DECLARED as an output of this workflow all along but nothing ever
          # wrote it, so every caller reading it got the empty string; this is
          # where it starts being produced.
          meta="$RUNNER_TEMP/build-meta-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.json"
          IMAGE_URL="${{ steps.tags.outputs.image_url }}"
          
          docker buildx build \
            --push \
            --platform ${{ inputs.platforms }} \
            --progress=plain \
            --network=host \
            --metadata-file "$meta" \
            ${{ steps.build-args.outputs.build_args }} \
            ${{ steps.dual.outputs.docker_args }} \
            ${{ steps.labels.outputs.labels }} \
            -f ${{ inputs.dockerfile_path }} \
            ${{ inputs.build_context }}
          
          DIGEST="$(jq -r '."containerimage.digest"' "$meta")"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::could not read containerimage.digest from buildx metadata"
            cat "$meta" || true
            exit 1
          fi
          echo "Pushed digest: $DIGEST"
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "✅ Sportsbook Nginx image built and pushed successfully"

      - name: Verify ECR and Harbor carry the SAME manifest digest
        # 🪤 `docker buildx imagetools inspect` prints whatever it finds and exits 0,
        # so RUNNING IT IS NOT A VERIFICATION. Every check here ends in an explicit
        # comparison.
        # 🪤 TWO EMPTY STRINGS COMPARE EQUAL: a `--format` that silently produced
        # nothing would sail through a bare equality test, so the sha256 SHAPE gate
        # runs first on each side and is the positive control for the equality gate.
        # 🔑 Anchored to the digest the BUILD produced, not just to agreement between
        # the registries: two references can agree and still both be an older image
        # if this run's push never landed.
        env:
          ECR_REF: ${{ steps.dual.outputs.ecr_ref }}
          HARBOR_REF: ${{ steps.dual.outputs.harbor_ref }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$1" | tr -d '"'
          }
          ecr_digest="$(digest_of "$ECR_REF")"
          harbor_digest="$(digest_of "$HARBOR_REF")"
          echo "ECR    $ECR_REF -> $ecr_digest"
          echo "Harbor $HARBOR_REF -> $harbor_digest"
          case "$ecr_digest"    in sha256:*) : ;; *) echo "::error::ECR digest is not a sha256 digest: '$ecr_digest'"; exit 1 ;; esac
          case "$harbor_digest" in sha256:*) : ;; *) echo "::error::Harbor digest is not a sha256 digest: '$harbor_digest'"; exit 1 ;; esac
          [ "$ecr_digest" = "$harbor_digest" ] \
            || { echo "::error::digest mismatch between registries: ECR $ecr_digest vs Harbor $harbor_digest"; exit 1; }
          case "$BUILD_DIGEST" in sha256:*) : ;; *) echo "::error::build step digest is not a sha256 digest: '$BUILD_DIGEST'"; exit 1 ;; esac
          [ "$ecr_digest" = "$BUILD_DIGEST" ] \
            || { echo "::error::registry digest $ecr_digest != the digest this build produced ($BUILD_DIGEST)"; exit 1; }
          echo "OK: $ecr_digest is in both registries and is the digest this build produced"

      - name: Every requested platform present in BOTH registries
        # 🔑 The platform list comes from `inputs.platforms`, the SAME value the
        # build consumed, so this gate can only ever assert what was requested.
        # 🪤 A BARE `grep -q "linux/amd64"` IS NOT A CHECK: `imagetools inspect`
        # prints free text and the string can appear outside the `Platform:` field.
        # The pattern is anchored to that field and to end-of-line, so
        # `linux/arm64/v8` does not satisfy `linux/arm64` either.
        # 🪤 An empty or whitespace-only list would make both loops no-ops and let
        # this gate pass having compared nothing — rejected BEFORE the loops. On the
        # runner's bash an unset array does not trip `set -u`, so this guard is what
        # stands between an empty list and a silent pass.
        env:
          ECR_REF: ${{ steps.dual.outputs.ecr_ref }}
          HARBOR_REF: ${{ steps.dual.outputs.harbor_ref }}
          WANT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          IFS=',' read -ra _want <<< "$WANT_PLATFORMS"
          want=()
          for _p in ${_want[@]+"${_want[@]}"}; do
            q="$(printf '%s' "$_p" | tr -d '[:space:]')"
            [ -n "$q" ] && want+=("$q")
          done
          [ "${#want[@]}" -gt 0 ] \
            || { echo "::error::inputs.platforms produced no platform to check: '$WANT_PLATFORMS'"; exit 1; }
          for ref in "$ECR_REF" "$HARBOR_REF"; do
            out="$(docker buildx imagetools inspect "$ref")"
            for q in "${want[@]}"; do
              grep -q "Platform:  *$q\$" <<< "$out" \
                || { printf '%s\n' "$out"
                     echo "::error::$ref does not advertise $q"; exit 1; }
            done
            echo "OK: $ref advertises ${want[*]}"
          done

      - name: Generate Nginx Build Report
        if: success()
        run: |
          {
            echo "## 🌐 Nginx Multi-Repository Build Report"
            echo "- **Image**: ${{ steps.build.outputs.image_url }}"
            echo "- **Nginx Version**: ${{ inputs.nginx_version }}"
            echo "- **Super Branch**: ${{ inputs.super_branch }}"
            echo "- **Platforms**: ${{ inputs.platforms }}"
            echo "- **Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Git Commit**: ${{ github.sha }}"
            echo "- **Configuration**: Custom nginx + conf.d setup"
          } > nginx_build_report.md

      - name: Upload Nginx Build Report
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nginx-build-report-${{ inputs.version }}
          path: nginx_build_report.md
          retention-days: 30